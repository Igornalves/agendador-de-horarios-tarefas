spring:
  application:
    name: agendador-de-horarios-tarefas
  datasource:
    url: jdbc:h2:file:./dados/meubanco
    drive-class-name: org.h2.Driver
    username: igor
    password:
  jpa:
    open-in-view: true
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
       hibernate:
           dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  servlet:
    context-path: /${spring.application.name}/api
  port: 8080
  ssl:
    enabled: false

spring-doc:
  swagger-ui:
    enabled: true
    path: "/v1/api-docs.html"
  api-docs:
    enabled: true
